name: Update contribution stats

on:
  schedule:
    # 03:00 UTC daily — 10:00 Asia/Ho_Chi_Minh
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-contributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      LOGIN: TNL293107
      FIRST_YEAR: 2023
      README: README.md

    steps:
      - uses: actions/checkout@v4

      - name: Collect stats since ${{ env.FIRST_YEAR }}
        id: count
        env:
          # GITHUB_TOKEN is enough to read a public contribution calendar. If
          # GitHub ever stops allowing it, add a personal access token with
          # read:user as a CONTRIB_TOKEN secret and this picks it up with no
          # other change.
          GH_TOKEN: ${{ secrets.CONTRIB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Contributions, commits and PRs are per-period totals, so they are
          # summed year by year. Repositories contributed to is a distinct
          # count and would be wrong if summed the same way.
          yearly='query($login:String!,$from:DateTime!,$to:DateTime!){
            user(login:$login){
              contributionsCollection(from:$from,to:$to){
                contributionCalendar{ totalContributions }
                totalCommitContributions
                totalPullRequestContributions
              }
            }
          }'

          repos_query='query($login:String!){
            user(login:$login){
              repositoriesContributedTo(
                contributionTypes:[COMMIT,PULL_REQUEST],
                includeUserRepositories:true,
                first:0
              ){ totalCount }
            }
          }'

          contributions=0
          commits=0
          prs=0

          for year in $(seq "$FIRST_YEAR" "$(date -u +%Y)"); do
            read -r y_contrib y_commits y_prs < <(
              gh api graphql \
                -f query="$yearly" \
                -F login="$LOGIN" \
                -F from="${year}-01-01T00:00:00Z" \
                -F to="${year}-12-31T23:59:59Z" \
                --jq '.data.user.contributionsCollection
                      | "\(.contributionCalendar.totalContributions) \(.totalCommitContributions) \(.totalPullRequestContributions)"'
            )

            for value in "$y_contrib" "$y_commits" "$y_prs"; do
              if ! [[ "$value" =~ ^[0-9]+$ ]]; then
                echo "::error::$year returned a non-numeric value: '$value'"
                exit 1
              fi
            done

            echo "$year: contributions=$y_contrib commits=$y_commits prs=$y_prs"
            contributions=$((contributions + y_contrib))
            commits=$((commits + y_commits))
            prs=$((prs + y_prs))
          done

          repos=$(gh api graphql -f query="$repos_query" -F login="$LOGIN" \
            --jq '.data.user.repositoriesContributedTo.totalCount')

          if ! [[ "$repos" =~ ^[0-9]+$ ]]; then
            echo "::error::repository count was non-numeric: '$repos'"
            exit 1
          fi

          # A zero here means the query succeeded but returned nothing useful.
          # Writing that into the badges would be worse than failing.
          if [ "$contributions" -eq 0 ] || [ "$commits" -eq 0 ]; then
            echo "::error::contributions=$contributions commits=$commits, refusing to overwrite"
            exit 1
          fi

          {
            echo "contributions=$contributions"
            echo "commits=$commits"
            echo "prs=$prs"
            echo "repos=$repos"
          } >> "$GITHUB_OUTPUT"

          echo "Totals: contributions=$contributions commits=$commits prs=$prs repos=$repos"

      - name: Rewrite the badges
        id: rewrite
        env:
          CONTRIBUTIONS: ${{ steps.count.outputs.contributions }}
          COMMITS: ${{ steps.count.outputs.commits }}
          PRS: ${{ steps.count.outputs.prs }}
          REPOS: ${{ steps.count.outputs.repos }}
        run: |
          set -euo pipefail

          markers=$(grep -c 'stats:start' "$README" || true)
          if [ "$markers" -ne 1 ]; then
            echo "::error::expected exactly one stats:start marker, found $markers"
            exit 1
          fi

          python3 - "$README" <<'PY'
          import os, re, sys

          path = sys.argv[1]

          # label, value, colour, alt text
          badges = [
              ("contributions",  os.environ["CONTRIBUTIONS"], "1F6FEB", "{} contributions"),
              ("commits",        os.environ["COMMITS"],       "388BFD", "{} commits"),
              ("pull requests",  os.environ["PRS"],           "58A6FF", "{} pull requests"),
              ("repositories",   os.environ["REPOS"],         "79C0FF", "contributed to {} repositories"),
          ]

          lines = ["<!-- stats:start -->"]
          for label, value, colour, alt in badges:
              slug = label.replace(" ", "%20")
              url = (
                  f"https://img.shields.io/badge/{slug}-{value}-{colour}"
                  "?style=for-the-badge&labelColor=0D1117"
              )
              lines.append(f'<img src="{url}" alt="{alt.format(value)}" />')
          lines.append("<!-- stats:end -->")

          src = open(path, encoding="utf-8").read()
          out, n = re.subn(
              r"<!-- stats:start -->.*?<!-- stats:end -->",
              lambda _: "\n".join(lines),
              src,
              flags=re.DOTALL,
          )

          if n != 1:
              sys.exit(f"expected 1 marker block, replaced {n}")

          open(path, "w", encoding="utf-8", newline="\n").write(out)
          PY

          if git diff --quiet -- "$README"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Badges already current, nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit
        if: steps.rewrite.outputs.changed == 'true'
        env:
          CONTRIBUTIONS: ${{ steps.count.outputs.contributions }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$README"
          git commit -m "chore: update contribution stats ($CONTRIBUTIONS contributions)"
          git push
